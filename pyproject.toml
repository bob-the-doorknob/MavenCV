[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheepathon"
version = "0.1.0"
description = "TODO: short project description"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TODO: Author Name" }]
# keywords = ["TODO"]
# classifiers = []

dependencies = [
    # TODO: runtime dependencies, e.g.
    # "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/bob-the-doorknob/placeholder-name"
Issues = "https://github.com/bob-the-doorknob/placeholder-name/issues"

[project.scripts]
sheepathon = "sheepathon.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
